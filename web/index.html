<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cómo llego?</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--muted:#5b6578;--line:#d5dbe5;--btn:#14213d;--btnt:#fff;--warn:#fff4d6;--warnt:#6b4b00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eef1f7;--muted:#9aa5bb;--line:#2d3a57;--btn:#f2c94c;--btnt:#14213d;--warn:#3a3014;--warnt:#f6dc8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 40px/1 'Barlow Condensed',sans-serif;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
form,.ruta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:600;margin-bottom:4px}
select{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.par{display:grid;gap:12px}
.acciones{display:flex;gap:8px;margin-top:16px}
button{font:600 16px Barlow,sans-serif;border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.p{flex:1;background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #2f80ed;outline-offset:2px}
#res{margin-top:20px;display:grid;gap:14px}
.aviso{background:var(--warn);color:var(--warnt);padding:14px;border-radius:12px}
.ruta h2{font:700 24px 'Barlow Condensed',sans-serif;margin:0 0 2px}
.meta{color:var(--muted);margin:0 0 14px}
.tramo{position:relative;padding-left:34px}
.tramo::before{content:"";position:absolute;left:10px;top:12px;bottom:-12px;width:8px;border-radius:4px;background:var(--c)}
.ruta .tramo:last-of-type::before{bottom:12px}
.badge{display:inline-block;background:var(--c);color:#fff;font-weight:600;border-radius:6px;padding:0 8px;margin:0 0 4px}
.est{position:relative;margin:0;padding:2px 0}
.est::before{content:"";position:absolute;left:-30px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--c)}
.est.k{font-weight:600}
.tr{margin:2px 0 8px;color:var(--muted);font-size:14px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>¿Cómo llego?</h1>
<p class="sub">Elige dónde estás y a dónde vas. Te mostramos las mejores rutas.</p>

<form id="f">
<div class="par">
<div><label for="o">Estación de origen</label><select id="o"></select></div>
<div><label for="d">Estación de destino</label><select id="d"></select></div>
</div>
<div class="acciones">
<button class="p" type="submit">Buscar ruta</button>
<button type="button" id="inv" aria-label="Invertir origen y destino">Invertir</button>
<button type="button" id="nueva">Nueva consulta</button>
</div>
</form>

<section id="res" aria-live="polite"></section>
</main>

<script>
const COL={l1:"#f04e98",l2:"#0057b8",l3:"#8a9a1b",l4:"#4fa99a",l5:"#e0a800",l6:"#e2231a",l7:"#e87c1e",l8:"#009a44",l9:"#6b4a3a",l12:"#a59a2a",la:"#8f2b8f",lb:"#7d8a80"};
const $=id=>document.getElementById(id), res=$("res");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nom=e=>e.split("_").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
const lin=l=>"Línea "+l.slice(1).toUpperCase();
const aviso=t=>res.innerHTML=`<div class="aviso">${esc(t)}</div>`;

async function init(){
  try{
    const r=await fetch("/api/estaciones"); const {estaciones}=await r.json();
    const ops='<option value="">Selecciona…</option>'+estaciones.map(e=>`<option value="${esc(e)}">${esc(nom(e))}</option>`).join("");
    $("o").innerHTML=ops; $("d").innerHTML=ops;
  }catch{aviso("No se pudo conectar con el motor Prolog. Recarga la página en unos segundos.")}
}

// Agrupa los pasos {de,a,linea} en tramos por línea
function agrupar(v){
  const g=[];
  v.tramos.forEach(p=>{
    const u=g[g.length-1];
    if(u&&u.linea===p.linea) u.estaciones.push(p.a);
    else g.push({linea:p.linea,estaciones:[p.de,p.a]});
  });
  return g;
}

function pintar(v,i){
  const g=agrupar(v), tb=g.length-1;
  const tr=g.map((t,k)=>{
    const c=COL[t.linea]||"#555", n=t.estaciones.length;
    const ests=t.estaciones.map((e,j)=>`<p class="est ${j==0||j==n-1?'k':''}">${esc(nom(e))}</p>`).join("");
    const nota=k<tb?`<p class="tr">Transbordo en ${esc(nom(t.estaciones[n-1]))}</p>`:"";
    return `<div class="tramo" style="--c:${c}"><span class="badge">${esc(lin(t.linea))}</span>${ests}${nota}</div>`;
  }).join("");
  const tx=tb===0?"sin transbordos":tb+(tb==1?" transbordo":" transbordos");
  const exp=g.map(t=>`${lin(t.linea)}: de ${nom(t.estaciones[0])} a ${nom(t.estaciones.at(-1))} (${t.estaciones.length-1} paradas).`);
  exp.push(`Costo total ${v.costo}: 1 por parada y 2 por cada transbordo. Se prefiere el menor costo.`);
  return `<article class="ruta"><h2>${i==0?"Mejor ruta":"Alternativa "+i}</h2>
  <p class="meta">${v.ruta.length} estaciones · ${tx} · costo ${esc(v.costo)}</p>${tr}
  <details><summary>¿Por qué esta ruta?</summary><ul>${exp.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details></article>`;
}

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const o=$("o").value,d=$("d").value;
  if(!o||!d) return aviso("Elige una estación de origen y una de destino.");
  if(o===d) return aviso("El origen y el destino son la misma estación.");
  res.innerHTML='<div class="aviso">Buscando rutas…</div>';
  try{
    const r=await fetch(`/api/viaje?origen=${encodeURIComponent(o)}&destino=${encodeURIComponent(d)}`);
    const j=await r.json();
    if(!j.ok) return aviso(j.mensaje||"No se encontró ruta entre estas estaciones.");
    const vistos=new Set(), lista=[];
    [j.mejor,...(j.alternativas||[]).sort((a,b)=>a.costo-b.costo)].forEach(v=>{
      const k=v.ruta.join(">"); if(!vistos.has(k)){vistos.add(k);lista.push(v)}
    });
    res.innerHTML=lista.slice(0,3).map(pintar).join("");
  }catch{aviso("No se pudo consultar el servidor. Intenta de nuevo.")}
});
$("inv").onclick=()=>{const a=$("o").value;$("o").value=$("d").value;$("d").value=a};
$("nueva").onclick=()=>{$("f").reset();res.innerHTML="";$("o").focus()};
init();
</script>
</body>
</html>
